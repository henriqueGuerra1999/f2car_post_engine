<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fenrion AI — Pré-visualização</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a10; --bg-alt:#0c0c13; --card:#101119;
    --coral:#ff5a4e; --gold:#ffb347; --orange:#ff7a30; --orange-2:#ff8a5c;
    --white:#f2f3f6; --white-soft:#eaeaea; --body:#c9cdd7; --muted:#99a1b1;
    --faint:#78828c; --divider:#28262e;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--body); font-family:'Inter',-apple-system,sans-serif; }
  .wrap{ max-width:1080px; margin:0 auto; padding:56px 24px 90px; }

  .top{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:8px; }
  .brand-block{ display:flex; align-items:center; gap:14px; }
  .brand-block img{ height:42px; width:auto; display:block; }
  .brand{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; color:var(--white-soft); }
  .brand span{ color:var(--orange); }
  .brand-sub{ font-size:10.5px; letter-spacing:2.5px; color:var(--muted); text-transform:uppercase; margin-top:2px; }

  h1{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:28px; color:var(--white-soft); margin:34px 0 6px; }
  .lede{ font-size:14px; color:var(--muted); max-width:620px; line-height:1.6; margin-bottom:40px; }

  .status{ font-size:13.5px; color:var(--muted); padding:60px 0; text-align:center; }
  .status .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--orange); margin-right:8px; animation:pulse 1.2s infinite ease-in-out; }
  @keyframes pulse{ 0%,100%{ opacity:0.3; } 50%{ opacity:1; } }

  .vgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:4px; }
  .vcard{ position:relative; border-radius:4px; overflow:hidden; background:var(--card); aspect-ratio:4/5; }
  .vcard img{ width:100%; height:100%; object-fit:cover; display:block; }
  .vcard .skeleton{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:16px; text-align:center; }
  .vcard .skeleton .shimmer{ position:absolute; inset:0; background:linear-gradient(100deg, var(--card) 40%, #17181f 50%, var(--card) 60%); background-size:200% 100%; animation:shimmer 1.6s infinite; }
  @keyframes shimmer{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }
  .vcard .skeleton .name{ position:relative; font-size:13px; font-weight:600; color:var(--white-soft); }
  .vcard .skeleton .price{ position:relative; font-size:12px; color:var(--coral); font-weight:700; }
  .vcard.failed .skeleton .name{ color:var(--faint); }

  .foot{ margin-top:50px; padding-top:24px; border-top:1px solid var(--divider); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; font-size:11.5px; color:var(--faint); }

  .empty{ text-align:center; padding:70px 0; color:var(--faint); font-size:13.5px; }
  .retry{ margin-top:16px; background:var(--orange); color:#1a0b02; border:none; border-radius:8px; padding:10px 20px; font-weight:600; font-size:13px; cursor:pointer; }
</style>
</head>
<body>

    <div class="brand-block">

  <h1 id="title">Pré-visualização de conteúdo</h1>
  <div class="lede" id="lede">A gerar os próximos posts a partir do inventário atual — sem qualquer edição manual.</div>

  <div id="content">
    <div class="status"><span class="dot"></span>A ligar ao inventário…</div>
  </div>

  <div class="foot">
    <span id="foot-left"></span>
    <span>Fenrion AI — conteúdo gerado e publicado automaticamente</span>
  </div>

</div>

<script>
const clientId = window.location.pathname.split("/").filter(Boolean).pop();
const LIMIT = 9;

async function safeJson(url){
  try{
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

// fetch com timeout -- em vez de ficar preso indefinidamente se a rede
// (sobretudo em dados moveis) cortar a ligacao a meio de um pedido longo
function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
}

function cardId(v){
  return (v.slug || v.id || v.model || Math.random()).toString().replace(/[^a-z0-9]/gi, "");
}

function renderSkeletons(vehicles){
  document.getElementById("content").innerHTML = `<div class="vgrid">` +
    vehicles.map(v => `
      <div class="vcard" id="card-${cardId(v)}">
        <div class="skeleton"><div class="shimmer"></div>
          <div class="name">${v.model}</div>
          <div class="price">${v.price || ""}</div>
        </div>
      </div>
    `).join("") + `</div>`;
}

function fillImage(v, imageUrl){
  const el = document.getElementById(`card-${cardId(v)}`);
  if (!el) return;
  el.innerHTML = `<img src="${imageUrl}" alt="${v.model}">`;
}

function markFailed(v){
  const el = document.getElementById(`card-${cardId(v)}`);
  if (!el) return;
  el.classList.add("failed");
  const shimmer = el.querySelector(".shimmer");
  if (shimmer) shimmer.remove();
}

function showRetry(msg){
  document.getElementById("content").innerHTML =
    `<div class="empty">${msg}<br><button class="retry" onclick="load()">Tentar outra vez</button></div>`;
}

async function load(){
  document.getElementById("content").innerHTML = `<div class="status"><span class="dot"></span>A ligar ao inventário…</div>`;

  const clients = await safeJson("/clientes");
  const clientName = (clients && clients[clientId] && clients[clientId].name) || clientId;
  document.getElementById("lede").textContent =
    `A gerar os próximos posts para ${clientName} a partir do inventário atual — sem qualquer edição manual.`;
  document.getElementById("foot-left").textContent = `Cliente: ${clientName}`;

  const critData = await safeJson(`/criterios/${clientId}`);
  const criteria = (critData && critData.criteria) || {};
  const criteriaParam = encodeURIComponent(JSON.stringify(criteria));

  // Passo 1: lista de viaturas (rapido) -- mostra logo os cartoes com
  // nome/preco, para nunca parecer que a pagina esta parada.
  let vehiclesRes;
  try{
    vehiclesRes = await fetchWithTimeout(`/viaturas/${clientId}?criteria=${criteriaParam}`, 20000);
  }catch(e){
    showRetry("Não foi possível ligar ao inventário. Verifica a ligação e tenta outra vez.");
    return;
  }
  if (!vehiclesRes.ok){
    showRetry("Não foi possível carregar o inventário de momento.");
    return;
  }
  const vehiclesData = await vehiclesRes.json();
  const vehicles = (vehiclesData.viaturas || []).slice(0, LIMIT);

  if (!vehicles.length){
    document.getElementById("content").innerHTML = `<div class="empty">Sem viaturas a mostrar de momento.</div>`;
    return;
  }
  renderSkeletons(vehicles);

  // Passo 2: gera as imagens (o servidor ja as faz em paralelo) -- timeout
  // generoso porque isto envolve descarregar fotos + renderizar cada post,
  // mas com um limite claro em vez de esperar para sempre.
  let imgRes;
  try{
    imgRes = await fetchWithTimeout(`/preview-imagens/${clientId}?criteria=${criteriaParam}&limit=${LIMIT}`, 60000);
  }catch(e){
    vehicles.forEach(markFailed);
    return;
  }
  if (!imgRes.ok){
    vehicles.forEach(markFailed);
    return;
  }
  const imgData = await imgRes.json();
  (imgData.resultados || []).forEach(r => {
    if (r.image_url) fillImage(r.vehicle, r.image_url);
    else markFailed(r.vehicle);
  });
}

load();
</script>
</body>
</html>
